name: Build docker image

on:
  pull_request:
  push:
    branches:
      - master

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  BASE_IMAGE_REVISION: 2.16.3
  SOLR9: '9.11.0'
  SOLR10: '10.0.0'

jobs:
  solr10-build:
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        id: brotli-image
        env:
          SOLR_VER: ${{ env.SOLR10 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Verify Brotli security fixes
        uses: wodby/images/.github/actions/check-brotli@4d79323d1d62295e425a222e8cb23ccf843cbbea
        with:
          image: ${{ steps.brotli-image.outputs.image }}
      - name: Push verified architecture image
        if: github.event_name == 'push'
        env:
          SOLR_VER: ${{ env.SOLR10 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  solr10-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - solr10-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.SOLR10 }}
          latest: true
          latest_major: true
  solr9-build:
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        id: brotli-image
        env:
          SOLR_VER: ${{ env.SOLR9 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Verify Brotli security fixes
        uses: wodby/images/.github/actions/check-brotli@4d79323d1d62295e425a222e8cb23ccf843cbbea
        with:
          image: ${{ steps.brotli-image.outputs.image }}
      - name: Push verified architecture image
        if: github.event_name == 'push'
        env:
          SOLR_VER: ${{ env.SOLR9 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  solr9-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - solr9-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.SOLR9 }}
          latest_major: true

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ solr10-push, solr9-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
